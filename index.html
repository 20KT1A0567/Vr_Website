<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: ws: http://localhost:8080; media-src 'self' https:; frame-src 'self' https:;" />
    <!-- Enterprise SEO Meta Tags -->
    <title>VR Technologies | Premium Enterprise E-Commerce Store</title>
    <meta name="description" content="Shop certified refurbished laptops and desktops at VR Technologies. Free delivery, 30-day returns, warranty included. Starting ₹4,999." />
    <meta name="author" content="VR Technologies" />
    <link rel="canonical" href="https://venkat.anushatechnologies.com/" />
    <link rel="alternate" hreflang="en-IN" href="https://venkat.anushatechnologies.com/" />
    <link rel="alternate" hreflang="x-default" href="https://venkat.anushatechnologies.com/" />

    <!-- Open Graph / Facebook Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://venkat.anushatechnologies.com/" />
    <meta property="og:title" content="VR Technologies | Premium Enterprise E-Commerce Store" />
    <meta property="og:description" content="Explore premium collections and enjoy lightning-fast checkouts with dynamic inventory controls at VR Technologies." />
    <meta property="og:image" content="https://venkat.anushatechnologies.com/assets/og-cover.jpg" />

    <!-- Twitter Card Social Previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vrtechnologies" />
    <meta name="twitter:creator" content="@vrtechnologies" />
    <meta name="twitter:url" content="https://venkat.anushatechnologies.com/" />
    <meta name="twitter:title" content="VR Technologies | Premium Enterprise E-Commerce Store" />
    <meta name="twitter:description" content="Explore premium collections and enjoy lightning-fast checkouts with dynamic inventory controls at VR Technologies." />
    <meta name="twitter:image" content="https://venkat.anushatechnologies.com/assets/og-cover.jpg" />

    <!-- Font & Asset Preload Optimization -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.razorpay.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Favicon Links & Manifest -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E3A8A" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "VR Technologies",
        "url": "https://venkat.anushatechnologies.com/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VR Technologies",
        "url": "https://venkat.anushatechnologies.com/",
        "logo": "https://venkat.anushatechnologies.com/favicon.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9999999999",
          "contactType": "customer service"
        }
      }
    </script>

    <!-- Analytics & Monitoring -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    <script
      src="https://browser.sentry-cdn.com/7.x/bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
